[project]
name = "azure-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "txominvs", email = "txominvs@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.25.3",
    "azure-search-documents>=12.0.0",
    "fastapi>=0.141.1",
    "langchain>=1.3.15",
    "langchain-openai>=1.6.0",
    "openai>=3.3.1",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[project.scripts]
azure-rag = "azure_rag:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
